<!-- app/templates/items/_item_table.html -->
<table class="table table-striped table-hover">
    <thead>
        <tr>
            <th>Código</th>
            <th>Nombre</th>
            <th class="text-end">Cantidad</th>
            <th class="text-end">Precio Compra</th>
            <th class="text-end">Precio Venta</th>
            <th class="text-center">Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for item in items %}
        <tr>
            <td>{{ item.codigo }}</td>
            <td>{{ item.nombre }}</td>
            <td class="text-end">{{ "%.2f"|format(item.cantidad) }}</td>
            <td class="text-end">${{ "%.2f"|format(item.precio_compra) }}</td>
            <td class="text-end">${{ "%.2f"|format(item.precio_venta) }}</td>
            <td class="text-center table-actions">
                <a href="/items/edit/{{ item.id }}" class="btn btn-sm btn-warning me-1" 
                   title="Editar" data-bs-toggle="tooltip">
                    <i class="fas fa-edit"></i>
                </a>
                <form action="/api/items/{{ item.id }}" method="POST" class="d-inline">
                    <input type="hidden" name="_method" value="DELETE">
                    <button type="submit" class="btn btn-sm btn-danger" 
                            title="Eliminar" data-bs-toggle="tooltip">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
