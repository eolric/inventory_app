<!-- app/templates/items/_form_fields.html -->
<div class="mb-3">
    <label for="codigo" class="form-label">Código</label>
    <input type="text" class="form-control" id="codigo" name="codigo" 
           {% if item %}value="{{ item.codigo }}"{% endif %}
           required pattern="^[a-zA-Z0-9-]+$" title="Solo letras, números y guiones">
    <div class="invalid-feedback">
        Por favor ingrese un código válido (solo letras, números y guiones)
    </div>
</div>
<div class="mb-3">
    <label for="nombre" class="form-label">Nombre</label>
    <input type="text" class="form-control" id="nombre" name="nombre" 
           {% if item %}value="{{ item.nombre }}"{% endif %}
           required minlength="3" maxlength="100">
    <div class="invalid-feedback">
        Por favor ingrese un nombre válido (3-100 caracteres)
    </div>
</div>
<div class="mb-3">
    <label for="cantidad" class="form-label">Cantidad</label>
    <input type="number" class="form-control" id="cantidad" name="cantidad" 
           {% if item %}value="{{ item.cantidad }}"{% endif %}
           min="0" step="0.01" required>
    <div class="invalid-feedback">
        La cantidad no puede ser negativa
    </div>
</div>
<div class="mb-3">
    <label for="precio_compra" class="form-label">Precio de Compra</label>
    <input type="number" step="0.01" class="form-control" id="precio_compra" 
           name="precio_compra" {% if item %}value="{{ item.precio_compra }}"{% endif %}
           min="0" required>
    <div class="invalid-feedback">
        El precio de compra no puede ser negativo
    </div>
</div>
<div class="mb-3">
    <label for="precio_venta" class="form-label">Precio de Venta</label>
    <input type="number" step="0.01" class="form-control" id="precio_venta" 
           name="precio_venta" {% if item %}value="{{ item.precio_venta }}"{% endif %}
           min="0" required>
    <div class="invalid-feedback" id="precio_venta_error">
        El precio de venta debe ser mayor al de compra
    </div>
</div>
