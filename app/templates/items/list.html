{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0 text-gray-800">Items del Inventario</h1>
        <div>
            <a href="/items/create" class="btn btn-primary me-2">
                <i class="fas fa-plus-circle me-1"></i> Nuevo Item
            </a>
            <a href="/items/search" class="btn btn-outline-secondary">
                <i class="fas fa-search me-1"></i> Buscar
            </a>
        </div>
    </div>

    {% if not items %}
    <div class="alert alert-info">
        No hay items en el inventario. <a href="/items/create" class="alert-link">Crear nuevo item</a>
    </div>
    {% else %}
    <div class="card shadow mb-4">
        <div class="card-body">
            <div class="table-responsive">
                {% include "items/_item_table.html" %}
            </div>
        </div>
    </div>
    {% endif %}
</div>
{% endblock %}
